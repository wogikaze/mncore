name = "proofs_lean"
version = "0.1.0"
defaultTargets = ["proofs_lean"]
# Lake may compile several modules in parallel; keep each Lean worker modest so
# parallel module builds do not multiply the default hardware-sized thread pool.
weakLeanArgs = ["-j", "2"]

[[lean_lib]]
name = "ProofsLean"

[[lean_exe]]
name = "proofs_lean"
root = "Main"

[[lean_exe]]
name = "alu_probe"
root = "ALUProbe"

[[lean_exe]]
name = "untyped_probe"
root = "UntypedProbe"

[[lean_exe]]
name = "memory_probe"
root = "MemoryProbe"

[[lean_exe]]
name = "dynamic_address_probe"
root = "DynamicAddressProbe"

[[lean_exe]]
name = "mask_probe"
root = "MaskProbe"

[[lean_exe]]
name = "forwarding_probe"
root = "ForwardingProbe"

[[lean_exe]]
name = "lbf_encoded_probe"
root = "LBFEncodedProbe"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"
